<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Dmytro Ipatii - Full Stack Developer | Contact</title>
    <meta name="description" content="Get in touch with Dmytro Ipatii, a passionate Full Stack Developer specializing in JavaScript and TypeScript technologies. Connect via website, LinkedIn, Twitter, GitHub, or email.">
    <meta name="keywords" content="Dmytro Ipatii, Full Stack Developer, JavaScript Developer, TypeScript Developer, web development, contact">
    <meta name="author" content="Dmytro Ipatii">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Dmytro Ipatii - Full Stack Developer">
    <meta property="og:description" content="Get in touch with Dmytro Ipatii, a passionate Full Stack Developer specializing in JavaScript and TypeScript technologies.">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://yourdomain.com">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dmytro Ipatii - Full Stack Developer">
    <meta name="twitter:description" content="Connect with Dmytro Ipatii, Full Stack Developer">
    
    <link rel="canonical" href="https://yourdomain.com">
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- External Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
</head>
<body>
    <!-- Background Animation -->
    <div id="vanta" aria-label="Animated background" role="img"></div>
    
    <!-- Main Content -->
    <main>
        <!-- Contact Header Section -->
        <header class="contact-header" role="banner">
            <div class="initials-avatar floating" aria-label="Dmytro Ipatii initials avatar">
                <span aria-hidden="true">DI</span>
            </div>
            
            <!-- Primary Heading -->
            <h1>Dmytro Ipatii</h1>
            <p>Full Stack Developer</p>
        </header>

        <!-- Contact Links Section -->
        <div class="contact-links-container" role="navigation" aria-label="Contact links">
           
            
            <a href="https://www.linkedin.com/in/dmytro-ipattii-82aa04223/" class="contact-link" target="_blank" rel="noopener noreferrer" aria-label="Visit LinkedIn profile">
                <i class="fab fa-linkedin" aria-hidden="true"></i>
                <span>LinkedIn</span>
            </a>
            
            <a href="https://twitter.com/DmytroIpatii" class="contact-link" target="_blank" rel="noopener noreferrer" aria-label="Visit Twitter profile">
                <i class="fab fa-twitter" aria-hidden="true"></i>
                <span>Twitter</span>
            </a>
            
            <a href="https://github.com/monkeyking123g" class="contact-link" target="_blank" rel="noopener noreferrer" aria-label="Visit GitHub profile">
                <i class="fab fa-github" aria-hidden="true"></i>
                <span>GitHub</span>
            </a>
            
            <a href="mailto:dimaipatii1994@gmail.com" class="contact-link" target="_blank" rel="noopener noreferrer" aria-label="Send email">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>Email</span>
            </a>
        </div>
        
        <!-- Footer Section -->
        <footer role="contentinfo">
            <p>&copy; 2023 Dmytro Ipatii. All rights reserved.</p>
        </footer>
    </main>
    
    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize VANTA.js background effect
            if (document.getElementById('vanta')) {
                VANTA.BIRDS({
                    el: "#vanta",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    backgroundColor: 0x0f0f23,
                    color1: 0x2a2c55,
                    color2: 0x4a4c75,
                    birdSize: 0.70,
                    wingSpan: 18.00,
                    speedLimit: 1.00,
                    separation: 50.00,
                    alignment: 35.00,
                    cohesion: 35.00,
                    quantity: 2.50
                })
            }

            // Fade in content after initialization
            setTimeout(() => {
                const main = document.querySelector('main');
                if (main) {
                    main.style.opacity = 1;
                    main.style.filter = 'blur(0px)';
                }
            }, 1500);
        });
    </script>
</body>
</html>
